<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radar — expectional.dev</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0d0d0d; color: #ccc; font-family: system-ui, sans-serif; }
    #root { width: 100%; height: 100vh; margin: 0; padding: 0; }
    #root iframe { width: 100%; height: 100%; border: 0; display: block; }
    .err { padding: 2rem; max-width: 40rem; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var id = q.get("session");
      var root = document.getElementById("root");
      if (!id || !id.trim()) {
        root.innerHTML =
          '<div class="err"><p><strong>session</strong> gerekli.</p><p>Expectional içinden kopyalanan link şu formatta olmalı:</p>' +
          '<p><code>' + location.origin + location.pathname + '?session=...</code></p></div>';
        return;
      }
      id = id.trim();
      var valthrun = "https://radar.valth.run/session/" + encodeURIComponent(id);
      root.innerHTML =
        '<iframe title="Cloud radar" src="' + valthrun + '" allow="fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>';
    })();
  </script>
</body>
</html>
